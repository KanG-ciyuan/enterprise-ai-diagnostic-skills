name: local-checks

# Runs the repository's own validation that is documented in README.md under
# "Validation Status": eight stdlib `unittest` suites plus the provenance guard.
# No Python dependencies are installed — the check is Python 3 standard library only.
#
# The same script is the documented local entry point, so CI and a developer's
# machine cannot drift apart for the 131 Skills checks.
#
# The application prototype is validated by additional Node.js steps below. Those
# tests use a local model stub and need no API key, paid model call, network or
# production database. They are intentionally limited to the two targeted suites;
# the historical G14 full audit is not part of CI.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run local checks
        run: ./scripts/run_local_checks.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Application tests were validated locally with Node 22.22.3.
          node-version: "22"

      - name: Run application targeted checks
        working-directory: apps/enterprise-diagnostic
        run: |
          node tests/pilot09c_g14_final_fix_runtime.mjs
          node tests/pilot09c_g14_runtime.mjs

  # R2A database safety: the migration chain is the only schema authority; generated
  # artifacts must be reproducible; legacy databases must be refused (no auto-migration).
  # Read-only jobs only (no network, no credentials, no remote D1, no real databases).
  db-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Lock append-only check compares the committed lock with its previous revision.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pin the exact Node version used for the R2A local evidence. The generated
          # artifacts embed node:sqlite's canonical DDL formatting, so an unpinned
          # Node line could drift across bundled SQLite versions.
          node-version: "22.22.3"

      - name: Generated schema artifacts are up to date
        working-directory: apps/enterprise-diagnostic
        run: node scripts/gen-schema-snapshot.mjs --check

      - name: Database safety tests (in-memory / isolated temp dirs only)
        working-directory: apps/enterprise-diagnostic
        run: |
          node tests/db_generated_artifacts_runtime.mjs
          node tests/db_migration_lock_runtime.mjs
          node tests/db_state_matrix_runtime.mjs
          node tests/readiness_runtime.mjs
          node tests/migration_runtime.mjs
